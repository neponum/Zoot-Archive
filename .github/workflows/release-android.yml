name: Release Android

# Бета-APK подписан debug-ключом: устанавливается вручную, обновляется поверх.
# Release-keystore подключим, когда появится стабильная ветка.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web for Capacitor
        run: npm run build:native

      - name: Sync Android project
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "out/rhodes-${GITHUB_REF_NAME:-beta}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rhodes-android-apk
          path: out/*.apk

      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          draft: true
          prerelease: true
