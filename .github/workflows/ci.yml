name: CI

# Проверка данных и сборки на каждый пуш в main и в PR.
# Приложение для десктопа/Android здесь не собирается — это в release-*.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate data
        run: npm run validate:data

      - name: Typecheck
        run: npm run lint

      - name: Build web
        run: npm run build
